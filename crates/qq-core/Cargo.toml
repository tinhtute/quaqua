[package]
name = "qq-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "qq_core"
path = "src/lib.rs"

[[bin]]
name = "qq"
path = "src/main.rs"

[dependencies]
# Same exact pins as crates/quaqua. Carried for the wave 2 modules:
# rusqlite (db, engine journal), serde + serde_json (journal, herdr replies),
# toml (team.toml seed and testkit temp config).
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
toml = "=1.1.8"
