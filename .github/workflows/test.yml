name: Test

# Every PR into main, and every push to main, runs the workspace test suite and
# lints the workflow files. The check names are "Test / cargo test (workspace)"
# and "Test / actionlint (workflows)"; both are required status checks in branch
# protection, so a red lint blocks a merge exactly like a red test.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as release.yml: the stable ref that carries toolchain 1.99.0,
      # the toolchain the workspace is developed and tested against.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7
        with:
          toolchain: 1.99.0

      - uses: Swatinem/rust-cache@v2

      # The runner has neither herdr nor tmux. Every test that reaches for the
      # daemon sets GRID_SKIP=1 + QUAQUA_TEST=1, so the whole suite runs here.
      - name: cargo test --locked
        run: cargo test --locked

      # The suite must be hermetic with respect to the live workspace database:
      # no test may open <passwd home>/quaqua/runs/quaqua.db* (the file the
      # owner's real workspace runs on). tests/test_hermetic_db.sh traces every
      # open(2) of that path across the whole suite and fails listing each hit,
      # and plants a decoy there for the traced run: an existence-gated open of
      # a path that does not exist calls no open(2) at all, which the runner's
      # missing workspace directory would otherwise hide.
      #
      # A second full run is deliberate: this step gates a second, independent
      # property, and the step above keeps reporting the suite's own result.
      # The build is already warm in target/, so the cost is suite runtime only.
      #
      # ubuntu-latest ships no strace; install it, and set
      # HERMETIC_REQUIRE_STRACE=1 so a failed install fails the step instead of
      # turning the guard into a silent skip.
      - name: Install strace
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends strace
          fi
          strace --version

      - name: hermetic workspace (no live workspace DB opens)
        env:
          HERMETIC_REQUIRE_STRACE: '1'
        run: bash tests/test_hermetic_db.sh

  # Lints .github/workflows/*.yml itself. Separate job so a lint failure never
  # hides the test result, and the two are required independently.
  #
  # Pinned to a version *and* to the release tarball's SHA256 taken from that
  # release's checksums file: a swapped or truncated asset fails the checksum
  # instead of running, and a new actionlint release cannot turn the gate red
  # on an unchanged workflow.
  #
  # actionlint also shellchecks every `run:` script when `shellcheck` is on
  # PATH; ubuntu-latest ships one, so the scripts are covered too.
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          (
            cd "$RUNNER_TEMP"
            echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          )
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/actionlint" --version

      - name: actionlint .github/workflows
        run: actionlint -color .github/workflows/*.yml
