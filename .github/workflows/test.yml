name: Test

# Every PR into main, and every push to main, runs the workspace test suite, the
# workspace clippy gate, the cos-memory mod's tests, and lints the workflow
# files. The check names are "Test / cargo test (workspace)" (which carries the
# clippy and hermetic-DB steps), "Test / cos-memory mod tests" and
# "Test / actionlint (workflows)".
#
# Required today: ruleset 25703680 requires only "cargo test (workspace)" and
# "actionlint (workflows)". "cos-memory mod tests" is NOT required yet, so a red
# mod test shows on the PR but does not block the merge until that context is
# added to the ruleset. Reword this to "all required" only once it is.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as release.yml: the stable ref that carries toolchain 1.99.0,
      # the toolchain the workspace is developed and tested against. The action
      # installs with --profile minimal, so clippy has to be asked for by name.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7
        with:
          toolchain: 1.99.0
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The runner has neither herdr nor tmux. Every test that reaches for the
      # daemon sets GRID_SKIP=1 + QUAQUA_TEST=1, so the whole suite runs here.
      - name: cargo test --locked
        run: cargo test --locked

      # The workspace is clippy-clean as of #256; this keeps it that way. Same
      # toolchain and warm target/ as the step above, so the cost is the check
      # pass only. --all-targets includes the test targets: a warning that only
      # fires inside a #[cfg(test)] module is still a warning to fix.
      - name: cargo clippy --locked --all-targets -- -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      # The suite must be hermetic with respect to the live workspace database:
      # no test may open <passwd home>/quaqua/runs/quaqua.db* (the file the
      # owner's real workspace runs on). tests/test_hermetic_db.sh traces every
      # open(2) of that path across the whole suite and fails listing each hit,
      # and plants a decoy there for the traced run: an existence-gated open of
      # a path that does not exist calls no open(2) at all, which the runner's
      # missing workspace directory would otherwise hide.
      #
      # A second full run is deliberate: this step gates a second, independent
      # property, and the step above keeps reporting the suite's own result.
      # The build is already warm in target/, so the cost is suite runtime only.
      #
      # ubuntu-latest ships no strace; install it, and set
      # HERMETIC_REQUIRE_STRACE=1 so a failed install fails the step instead of
      # turning the guard into a silent skip.
      #
      # Both hermetic steps run even after an earlier step failed: a clippy
      # warning must not hide the hermetic-DB result until the lint is fixed.
      - name: Install strace
        if: success() || failure()
        run: |
          set -euo pipefail
          if ! command -v strace >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends strace
          fi
          strace --version

      - name: hermetic workspace (no live workspace DB opens)
        if: success() || failure()
        env:
          HERMETIC_REQUIRE_STRACE: '1'
        run: bash tests/test_hermetic_db.sh

  # The cos-memory mod's tests are plain `node:test` files with no dependencies
  # (mods/cos-memory/package.json declares none), so a pinned Node major is the
  # whole setup: no install step, no lockfile, nothing to cache.
  #
  # Node 22+ takes glob patterns for --test and no longer expands a directory
  # argument, so the pattern is quoted and matched by the runner itself rather
  # than by the shell; `tests/**/*.test.js` is the same set the mod's own
  # `npm test` (node --test tests/) selects on the majors that still accept a
  # directory.
  mods:
    name: cos-memory mod tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # node --test exits 0 when its glob selects no file, so a renamed or moved
      # tests/ (or a switch to .mjs) would turn this gate into a silent green
      # with zero tests. The guard selects the same set the node glob does — any
      # *.test.js at any depth under tests/ — and fails the step when it is
      # empty.
      - name: node --test mods/cos-memory/tests
        run: |
          set -euo pipefail
          if [ -z "$(find mods/cos-memory/tests -type f -name '*.test.js' -print -quit)" ]; then
            echo "::error::no *.test.js files under mods/cos-memory/tests"
            exit 1
          fi
          node --test "mods/cos-memory/tests/**/*.test.js"

      # The mod's documented test set is the node tests above plus this script
      # (mods/cos-memory/README.md). Its claude-CLI checks skip when claude is
      # not on PATH, so it is safe on a bare runner.
      - name: install smoke (mods/cos-memory/tests/install_smoke.sh)
        run: bash mods/cos-memory/tests/install_smoke.sh

  # Lints .github/workflows/*.yml itself. Separate job so a lint failure never
  # hides the test result, and the two are required independently.
  #
  # Pinned to a version *and* to the release tarball's SHA256 taken from that
  # release's checksums file: a swapped or truncated asset fails the checksum
  # instead of running, and a new actionlint release cannot turn the gate red
  # on an unchanged workflow.
  #
  # actionlint also shellchecks every `run:` script when `shellcheck` is on
  # PATH; ubuntu-latest ships one, so the scripts are covered too.
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          (
            cd "$RUNNER_TEMP"
            echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          )
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/actionlint" --version

      - name: actionlint .github/workflows
        run: actionlint -color .github/workflows/*.yml
